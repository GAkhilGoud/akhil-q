<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviation Meteorology Quiz — IC Joshi</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #0a1628;
    --sky2: #0d2044;
    --horizon: #1a3a6e;
    --cloud: #c8d8f0;
    --white: #eef4ff;
    --accent: #38bdf8;
    --accent2: #7dd3fc;
    --gold: #fbbf24;
    --green: #34d399;
    --red: #f87171;
    --dim: #4a6080;
    --card: rgba(255,255,255,0.04);
    --border: rgba(56,189,248,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--sky);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 25%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 65%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 80%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 35%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 90%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(2px 2px at 78% 8%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(2px 2px at 5% 50%, rgba(255,255,255,0.5) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* Atmospheric glow */
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    left: -10%;
    width: 120%;
    height: 50%;
    background: radial-gradient(ellipse at 50% 100%, rgba(26,58,110,0.8) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; }

  /* ── HOME SCREEN ── */
  #home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    text-align: center;
  }

  .plane-icon {
    font-size: 3.5rem;
    margin-bottom: 1rem;
    animation: float 3s ease-in-out infinite;
    display: block;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
  }

  h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.1;
    color: var(--white);
    margin-bottom: 0.3rem;
  }
  h1 span { color: var(--accent); }

  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }

  .topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.75rem;
    max-width: 780px;
    width: 100%;
    margin-bottom: 2.5rem;
  }

  .topic-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--cloud);
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .topic-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(56,189,248,0.12), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .topic-btn:hover::before { opacity: 1; }
  .topic-btn:hover { border-color: var(--accent); color: var(--white); transform: translateY(-2px); }
  .topic-btn.active {
    background: rgba(56,189,248,0.15);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 20px rgba(56,189,248,0.2);
  }
  .topic-btn .count {
    display: block;
    font-size: 0.65rem;
    color: var(--dim);
    margin-top: 0.2rem;
    font-family: 'JetBrains Mono', monospace;
  }
  .topic-btn.active .count { color: var(--accent2); }

  .start-btn {
    background: linear-gradient(135deg, var(--accent), #0ea5e9);
    border: none;
    border-radius: 12px;
    padding: 1rem 3rem;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--sky);
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 30px rgba(56,189,248,0.3);
    text-transform: uppercase;
  }
  .start-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 40px rgba(56,189,248,0.45); }
  .start-btn:active { transform: translateY(0); }

  .mode-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 0.45rem 1.1rem;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--cloud);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .mode-pill:hover, .mode-pill.active {
    background: rgba(56,189,248,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── QUIZ SCREEN ── */
  #quiz { display: none; min-height: 100vh; padding: 1.5rem; max-width: 760px; margin: 0 auto; }

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .progress-wrap { flex: 1; min-width: 120px; }
  .progress-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--dim);
    margin-bottom: 0.3rem;
    display: flex;
    justify-content: space-between;
  }
  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #7dd3fc);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .stat-chips { display: flex; gap: 0.6rem; flex-shrink: 0; }
  .chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.35rem 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .chip .val { font-weight: 600; color: var(--accent); }
  .chip.correct .val { color: var(--green); }
  .chip.wrong .val { color: var(--red); }

  .topic-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(56,189,248,0.1);
    border: 1px solid rgba(56,189,248,0.2);
    border-radius: 6px;
    padding: 0.2rem 0.6rem;
    display: inline-block;
    margin-bottom: 0.8rem;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--dim);
    margin-bottom: 0.6rem;
  }

  .q-text {
    font-size: 1.05rem;
    font-weight: 400;
    line-height: 1.6;
    color: var(--white);
  }

  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    margin-bottom: 1.25rem;
  }

  .opt-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 0.9rem 1.2rem;
    cursor: pointer;
    transition: all 0.18s;
    text-align: left;
    display: flex;
    align-items: flex-start;
    gap: 0.9rem;
    color: var(--cloud);
    font-size: 0.9rem;
    line-height: 1.5;
    position: relative;
    overflow: hidden;
  }
  .opt-btn:hover:not(:disabled) {
    background: rgba(56,189,248,0.08);
    border-color: rgba(56,189,248,0.4);
    color: var(--white);
    transform: translateX(3px);
  }
  .opt-key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--dim);
    background: rgba(255,255,255,0.06);
    border-radius: 5px;
    padding: 0.15rem 0.45rem;
    flex-shrink: 0;
    margin-top: 0.1rem;
    transition: all 0.18s;
  }

  .opt-btn.correct {
    background: rgba(52,211,153,0.12);
    border-color: var(--green);
    color: var(--green);
  }
  .opt-btn.correct .opt-key { background: var(--green); color: var(--sky); }

  .opt-btn.wrong {
    background: rgba(248,113,113,0.12);
    border-color: var(--red);
    color: var(--red);
  }
  .opt-btn.wrong .opt-key { background: var(--red); color: var(--sky); }

  .opt-btn:disabled { cursor: default; transform: none !important; }

  .feedback-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
    display: none;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.88rem;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .feedback-bar.show { display: flex; }
  .feedback-bar.correct-fb { border-color: var(--green); background: rgba(52,211,153,0.08); }
  .feedback-bar.wrong-fb { border-color: var(--red); background: rgba(248,113,113,0.08); }
  .fb-icon { font-size: 1.4rem; flex-shrink: 0; }
  .fb-text { color: var(--cloud); line-height: 1.5; }

  .btn-row { display: flex; gap: 0.75rem; justify-content: flex-end; flex-wrap: wrap; }

  .nav-btn {
    background: linear-gradient(135deg, var(--accent), #0ea5e9);
    border: none;
    border-radius: 10px;
    padding: 0.75rem 1.8rem;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    color: var(--sky);
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .nav-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(56,189,248,0.35); }
  .nav-btn.skip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
  }
  .nav-btn.skip:hover { border-color: var(--dim); color: var(--cloud); }

  /* timer */
  .timer-ring { display: flex; align-items: center; gap: 0.5rem; }
  .timer-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    color: var(--accent);
    transition: color 0.3s;
    min-width: 1.8rem;
  }
  .timer-val.warn { color: var(--gold); }
  .timer-val.danger { color: var(--red); animation: pulse 0.5s ease infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

  /* ── RESULTS SCREEN ── */
  #results { display: none; min-height: 100vh; padding: 2rem; text-align: center; max-width: 680px; margin: 0 auto; }

  .result-plane {
    font-size: 4rem;
    margin-bottom: 1rem;
    display: block;
    animation: land 1s ease forwards;
  }
  @keyframes land {
    from { transform: translateY(-30px) rotate(-10deg); opacity: 0; }
    to { transform: translateY(0) rotate(0deg); opacity: 1; }
  }

  .score-ring {
    width: 160px;
    height: 160px;
    margin: 0 auto 1.5rem;
    position: relative;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring-track { stroke: rgba(255,255,255,0.08); fill: none; stroke-width: 10; }
  .score-ring-fill {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 440;
    stroke-dashoffset: 440;
    transition: stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1);
  }
  .score-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .score-pct {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--white);
    line-height: 1;
  }
  .score-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .grade-text {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
  }
  .grade-sub { font-size: 0.9rem; color: var(--dim); margin-bottom: 2rem; }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-bottom: 2rem;
  }
  .rstat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
  }
  .rstat .rv {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
  }
  .rstat .rl { font-size: 0.72rem; color: var(--dim); margin-top: 0.2rem; }

  .topic-breakdown {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    margin-bottom: 2rem;
    text-align: left;
  }
  .topic-breakdown h3 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  .tb-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.6rem;
  }
  .tb-name { font-size: 0.78rem; flex: 1; color: var(--cloud); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-bar-wrap { flex: 2; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  .tb-bar { height: 100%; border-radius: 3px; transition: width 1s ease; }
  .tb-score { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--dim); min-width: 2.5rem; text-align: right; }

  .result-btns { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  .result-btns button {
    background: linear-gradient(135deg, var(--accent), #0ea5e9);
    border: none;
    border-radius: 10px;
    padding: 0.8rem 2rem;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    color: var(--sky);
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .result-btns button.sec {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--cloud);
  }
  .result-btns button:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(56,189,248,0.3); }

  /* Streak badge */
  .streak-pop {
    position: fixed;
    top: 1.5rem; right: 1.5rem;
    background: rgba(251,191,36,0.15);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 0.6rem 1rem;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .streak-pop.show { opacity: 1; transform: translateY(0); }

  /* XP Pop */
  .xp-pop {
    position: fixed;
    pointer-events: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 12px rgba(52,211,153,0.5);
    opacity: 0;
    z-index: 200;
    transition: all 0s;
  }
  .xp-pop.fly {
    animation: xpFly 0.8s ease forwards;
  }
  @keyframes xpFly {
    0% { opacity: 1; transform: translateY(0) scale(1.2); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 8px; height: 8px;
    top: -10px;
    animation: confettiFall linear forwards;
    pointer-events: none;
    z-index: 300;
    border-radius: 2px;
  }
  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }

  /* Responsive */
  @media (max-width: 520px) {
    .result-stats { grid-template-columns: repeat(2, 1fr); }
    .topic-grid { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 1.8rem; }
    .q-text { font-size: 0.95rem; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ══════════ HOME ══════════ -->
  <div id="home">
    <span class="plane-icon">✈️</span>
    <h1>Aviation <span>Meteorology</span></h1>
    <p class="subtitle">IC Joshi — Ground Subjects CPL/ATPL &nbsp;·&nbsp; VII Edition</p>

    <div class="mode-row">
      <button class="mode-pill active" id="modeAll" onclick="setMode('all')">🌐 All Questions</button>
      <button class="mode-pill" id="modeRandom" onclick="setMode('random')">🎲 Random 30</button>
      <button class="mode-pill" id="modeWeak" onclick="setMode('weak')">⚠️ Weak Areas</button>
    </div>

    <div class="topic-grid" id="topicGrid"></div>
    <button class="start-btn" onclick="startQuiz()">Start Flight ›</button>
  </div>

  <!-- ══════════ QUIZ ══════════ -->
  <div id="quiz">
    <div class="quiz-header">
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="qLabel">Q 1 / 1</span>
          <div class="timer-ring">⏱ <span class="timer-val" id="timerVal">20</span>s</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="stat-chips">
        <div class="chip correct">✓ <span class="val" id="scoreC">0</span></div>
        <div class="chip wrong">✗ <span class="val" id="scoreW">0</span></div>
        <div class="chip">⚡ <span class="val" id="xpVal">0</span> XP</div>
      </div>
    </div>

    <div class="topic-tag" id="qTopic">TOPIC</div>

    <div class="question-card">
      <div class="q-num" id="qNum">Q001</div>
      <div class="q-text" id="qText"></div>
    </div>

    <div class="options-grid" id="optGrid"></div>

    <div class="feedback-bar" id="feedbackBar">
      <span class="fb-icon" id="fbIcon"></span>
      <span class="fb-text" id="fbText"></span>
    </div>

    <div class="btn-row">
      <button class="nav-btn skip" onclick="skipQ()">Skip</button>
      <button class="nav-btn" id="nextBtn" onclick="nextQ()" style="display:none">Next →</button>
    </div>
  </div>

  <!-- ══════════ RESULTS ══════════ -->
  <div id="results">
    <span class="result-plane" id="resultPlane">✈️</span>
    <div class="score-ring">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle class="score-ring-track" cx="80" cy="80" r="70"/>
        <circle class="score-ring-fill" id="ringFill" cx="80" cy="80" r="70"/>
      </svg>
      <div class="score-center">
        <div class="score-pct" id="pctText">0%</div>
        <div class="score-label">Score</div>
      </div>
    </div>
    <div class="grade-text" id="gradeText"></div>
    <div class="grade-sub" id="gradeSub"></div>

    <div class="result-stats">

// ── Build topic list ──
const topics = [...new Set(ALL_QUESTIONS.map(q => q.t))];

function buildTopicGrid() {
  const grid = document.getElementById('topicGrid');
  grid.innerHTML = '';
  // Count per topic
  const counts = {};
  ALL_QUESTIONS.forEach(q => { counts[q.t] = (counts[q.t]||0)+1; });

  // All topics btn
  const allBtn = document.createElement('button');
  allBtn.className = 'topic-btn active';
  allBtn.id = 'topic_ALL';
  allBtn.innerHTML = `📚 All Topics<span class="count">${ALL_QUESTIONS.length} Qs</span>`;
  allBtn.onclick = () => toggleTopic('ALL', allBtn);
  grid.appendChild(allBtn);

  topics.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn';
    btn.id = 'topic_' + t.replace(/\s+/g,'_');
    btn.innerHTML = `${topicEmoji(t)} ${t}<span class="count">${counts[t]} Qs</span>`;
    btn.onclick = () => toggleTopic(t, btn);
    grid.appendChild(btn);
  });
}

function topicEmoji(t) {
  const map = {
    'Optical Phenomena': '🌈',
    'Visibility & Fog': '🌫️',
    'Precipitation': '🌧️',
    'Ice Accretion': '🧊',
    'Thunderstorm': '⛈️',
    'Air Masses, Fronts & WD': '🌪️',
    'Jet Streams': '💨',
    'CAT & Mountain Waves': '⛰️',
    'Tropical Systems': '🌀',
    'Climatology of India': '🇮🇳',
    'Monsoon & General Circulation': '☁️',
    'Atmospheric Pressure': '🌡️',
    'Atmosphere': '🌍',
    'Temperature': '🔥',
    'Air Density': '🎈',
    'Humidity': '💧',
    'Wind': '🌬️',
    'Vertical Motion and Clouds': '☁️',
    'Stability of Atmosphere': '⚖️',
  };
  return map[t] || '📋';
}

function toggleTopic(t, btn) {
  const allBtn = document.getElementById('topic_ALL');
  if (t === 'ALL') {
    activeTopics.clear();
    document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  } else {
    allBtn.classList.remove('active');
    btn.classList.toggle('active');
    if (btn.classList.contains('active')) {
      activeTopics.add(t);
    } else {
      activeTopics.delete(t);
    }
    if (activeTopics.size === 0) {
      allBtn.classList.add('active');
    }
  }
}

function setMode(m) {
  quizMode = m;
  document.querySelectorAll('.mode-pill').forEach(p => p.classList.remove('active'));
  document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');
}

function getQuestions() {
  let pool;
  if (activeTopics.size === 0) {
    pool = [...ALL_QUESTIONS];
  } else {
    pool = ALL_QUESTIONS.filter(q => activeTopics.has(q.t));
  }

  if (quizMode === 'weak' && wrongQs.length > 0) {
    pool = wrongQs;
  }

  // Shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  if (quizMode === 'random') return pool.slice(0, 30);
  return pool;
}

function startQuiz() {
  questions = getQuestions();
  if (questions.length === 0) { alert('No questions match. Please adjust filters.'); return; }
  current = 0;
  correct = 0;
  wrong = 0;
  xp = 0;
  streak = 0;
  topicStats = {};
  wrongQs = [];
  answered = false;

  document.getElementById('home').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';

  renderQuestion();
}

function renderQuestion() {
  if (current >= questions.length) { showResults(); return; }
  answered = false;
  const q = questions[current];

  // Header
  document.getElementById('qLabel').textContent = `Q ${current+1} / ${questions.length}`;
  document.getElementById('progressFill').style.width = ((current/questions.length)*100) + '%';
  document.getElementById('qTopic').textContent = q.t;
  document.getElementById('qNum').textContent = `Q${String(current+1).padStart(3,'0')}`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('scoreC').textContent = correct;
  document.getElementById('scoreW').textContent = wrong;
  document.getElementById('xpVal').textContent = xp;

  // Hide feedback
  const fb = document.getElementById('feedbackBar');
  fb.className = 'feedback-bar';
  document.getElementById('nextBtn').style.display = 'none';

  // Options
  const grid = document.getElementById('optGrid');
  grid.innerHTML = '';
  const keys = ['A','B','C','D'];
  q.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-key">${keys[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i, btn);
    grid.appendChild(btn);
  });

  // Timer
  clearInterval(timer);
  timeLeft = 20;
  updateTimer();
  timer = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timer);
      if (!answered) timeUp();
    }
  }, 1000);
}

function updateTimer() {
  const el = document.getElementById('timerVal');
  el.textContent = timeLeft;
  el.className = 'timer-val' + (timeLeft <= 5 ? ' danger' : timeLeft <= 10 ? ' warn' : '');
}

function selectAnswer(idx, btn) {
  if (answered) return;
  answered = true;
  clearInterval(timer);

  const q = questions[current];
  const opts = document.querySelectorAll('.opt-btn');
  opts.forEach(b => b.disabled = true);

  const isCorrect = idx === q.a;

  // Highlight
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) opts[q.a].classList.add('correct');

  // Stats
  if (!topicStats[q.t]) topicStats[q.t] = {c:0, t:0};
  topicStats[q.t].t++;

  if (isCorrect) {
    correct++;
    streak++;
    const xpGain = 10 + (streak >= 3 ? streak * 2 : 0) + (timeLeft >= 15 ? 5 : 0);
    xp += xpGain;
    topicStats[q.t].c++;
    showXP('+' + xpGain + ' XP');
    if (streak >= 3) showStreak(streak);
    showFeedback(true, null);
  } else {
    wrong++;
    streak = 0;
    wrongQs.push(q);
    hideStreak();
    showFeedback(false, q.o[q.a]);
  }

  document.getElementById('scoreC').textContent = correct;
  document.getElementById('scoreW').textContent = wrong;
  document.getElementById('xpVal').textContent = xp;
  document.getElementById('nextBtn').style.display = 'inline-flex';
}

function timeUp() {
  answered = true;
  const q = questions[current];
  const opts = document.querySelectorAll('.opt-btn');
  opts.forEach(b => b.disabled = true);
  opts[q.a].classList.add('correct');
  wrong++;
  streak = 0;
  wrongQs.push(q);
  if (!topicStats[q.t]) topicStats[q.t] = {c:0, t:0};
  topicStats[q.t].t++;
  showFeedback(false, q.o[q.a]);
  document.getElementById('scoreW').textContent = wrong;
  document.getElementById('nextBtn').style.display = 'inline-flex';
}

function showFeedback(ok, correctAns) {
  const fb = document.getElementById('feedbackBar');
  fb.className = 'feedback-bar show ' + (ok ? 'correct-fb' : 'wrong-fb');
  document.getElementById('fbIcon').textContent = ok ? '✅' : '❌';
  document.getElementById('fbText').textContent = ok
    ? 'Correct! Well done.'
    : `Incorrect. The correct answer is: ${correctAns}`;
}

function skipQ() {
  clearInterval(timer);
  current++;
  renderQuestion();
}

function nextQ() {
  current++;
  renderQuestion();
}

function showXP(text) {
  const el = document.createElement('div');
  el.className = 'xp-pop';
  el.textContent = text;
  el.style.left = (Math.random() * 60 + 20) + '%';
  el.style.top = '30%';
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('fly'));
  setTimeout(() => el.remove(), 900);
}

let streakTimeout;
function showStreak(n) {
  const el = document.getElementById('streakPop');
  document.getElementById('streakCount').textContent = n;
  el.classList.add('show');
  clearTimeout(streakTimeout);
  streakTimeout = setTimeout(() => el.classList.remove('show'), 2500);
}

function hideStreak() {
  document.getElementById('streakPop').classList.remove('show');
}

// ── RESULTS ──
function showResults() {
  clearInterval(timer);
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';

  const total = correct + wrong;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  // Animated ring
  setTimeout(() => {
    const fill = document.getElementById('ringFill');
    const circumference = 440;
    const offset = circumference - (pct / 100) * circumference;
    fill.style.strokeDashoffset = offset;
    fill.style.stroke = pct >= 80 ? '#34d399' : pct >= 60 ? '#38bdf8' : pct >= 40 ? '#fbbf24' : '#f87171';
  }, 100);

  document.getElementById('pctText').textContent = pct + '%';
  document.getElementById('rsCorrect').textContent = correct;
  document.getElementById('rsWrong').textContent = wrong;
  document.getElementById('rsXP').textContent = xp;

  // Grade
  let grade, sub, emoji;
  if (pct >= 90) { grade = 'CAPTAIN'; sub = 'Outstanding performance! You\'re cleared for takeoff.'; emoji = '🏆'; }
  else if (pct >= 80) { grade = 'FIRST OFFICER'; sub = 'Excellent! Minor refinements needed.'; emoji = '✈️'; }
  else if (pct >= 70) { grade = 'SENIOR PILOT'; sub = 'Good job! Review weak areas.'; emoji = '😊'; }
  else if (pct >= 60) { grade = 'PILOT'; sub = 'Passed. Keep studying!'; emoji = '📚'; }
  else if (pct >= 50) { grade = 'STUDENT PILOT'; sub = 'Below average. More study required.'; emoji = '📖'; }
  else { grade = 'PRE-SOLO'; sub = 'Return to ground school. You can do it!'; emoji = '💪'; }

  document.getElementById('resultPlane').textContent = emoji;
  document.getElementById('gradeText').textContent = grade;
  document.getElementById('gradeSub').textContent = sub;

  // Topic breakdown
  const bd = document.getElementById('topicBreakdown');
  bd.innerHTML = '<h3>📊 Topic Breakdown</h3>';
  Object.entries(topicStats).forEach(([t, s]) => {
    const tPct = s.t > 0 ? Math.round((s.c/s.t)*100) : 0;
    const color = tPct >= 80 ? '#34d399' : tPct >= 60 ? '#38bdf8' : tPct >= 40 ? '#fbbf24' : '#f87171';
    bd.innerHTML += `
      <div class="tb-row">
        <span class="tb-name">${topicEmoji(t)} ${t}</span>
        <div class="tb-bar-wrap"><div class="tb-bar" style="width:${tPct}%;background:${color}"></div></div>
        <span class="tb-score">${s.c}/${s.t}</span>
      </div>`;
  });

  // Confetti if >= 70%
  if (pct >= 70) launchConfetti();
}

function launchConfetti() {
  const colors = ['#38bdf8','#34d399','#fbbf24','#f87171','#a78bfa','#fb923c'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      el.style.animationDelay = '0s';
      el.style.width = (6 + Math.random()*6) + 'px';
      el.style.height = (6 + Math.random()*6) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 50);
  }
}

function retryWrong() {
  if (wrongQs.length === 0) { alert('No wrong answers to retry!'); return; }
  questions = [...wrongQs];
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  current = 0; correct = 0; wrong = 0; xp = 0; streak = 0;
  topicStats = {}; wrongQs = []; answered = false;
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuestion();
}

function goHome() {
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('home').style.display = 'flex';
}

// ── Init ──
buildTopicGrid();
</script>
</body>
